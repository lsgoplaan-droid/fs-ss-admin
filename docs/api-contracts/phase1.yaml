        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeneralSettings"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneralSettings"

  /tenant/settings/security:
    get:
      tags: [Tenant — Settings]
      summary: Get security settings
      security:
        - cookieAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecuritySettings"
    put:
      tags: [Tenant — Settings]
      summary: Update security settings
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SecuritySettings"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecuritySettings"

  /tenant/settings/tax:
    get:
      tags: [Tenant — Settings]
      summary: Get tax settings (GSTIN, invoice template)
      security:
        - cookieAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaxSettings"
    put:
      tags: [Tenant — Settings]
      summary: Update tax settings — GSTIN validated against 15-char alphanumeric checksum
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaxSettings"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaxSettings"
        "400":
          description: GSTIN checksum invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error: { code: INVALID_GSTIN, message: "GSTIN checksum is invalid", field: "gstin" }

  # ============================================================================
  # TENANT — APPROVALS
  # ============================================================================

  /tenant/approvals/workflows:
    get:
      tags: [Tenant — Approvals]
      summary: List approval workflows
      security:
        - cookieAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ApprovalWorkflow"
    post:
      tags: [Tenant — Approvals]
      summary: Create a workflow (starts in DRAFT status)
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowCreate"
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalWorkflow"

  /tenant/approvals/workflows/{workflowId}:
    parameters:
      - name: workflowId
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Tenant — Approvals]
      summary: Get workflow with levels
      security:
        - cookieAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalWorkflow"
    put:
      tags: [Tenant — Approvals]
      summary: Update workflow definition (levels replaced entirely)
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowCreate"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalWorkflow"
    delete:
      tags: [Tenant — Approvals]
      summary: Archive workflow (status → ARCHIVED). Cannot delete with active instances.
      security:
        - cookieAuth: []
      responses:
        "204":
          description: Archived
        "409":
          description: Active approval instances exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /tenant/approvals/workflows/{workflowId}/activate:
    parameters:
      - name: workflowId
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Tenant — Approvals]
      summary: Activate workflow — creates WorkflowVersion + WorkflowLevelSnapshot
      description: |
        Activates the workflow (status DRAFT → ACTIVE).
        Creates an immutable WorkflowVersion + WorkflowLevelSnapshot.
        New ApprovalInstance submissions will reference this version.
        In-flight instances continue under their original version.
      security:
        - cookieAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalWorkflow"
        "400":
          description: Workflow has no levels or escalation_role_id missing where required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /tenant/approvals/instances:
    get:
      tags: [Tenant — Approvals]
      summary: List approval instances
      security:
        - cookieAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, APPROVED, REJECTED, TIMED_OUT, REVISION_REQUESTED]
        - name: entityType
          in: query
          schema:
            type: string
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ApprovalInstance"
                  nextCursor:
                    type: string
                    nullable: true

  /tenant/approvals/instances/{instanceId}:
    parameters:
      - name: instanceId
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Tenant — Approvals]
      summary: Get instance with full action history
      security:
        - cookieAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalInstance"

  /tenant/approvals/instances/{instanceId}/approve:
    parameters:
      - name: instanceId
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Tenant — Approvals]
      summary: Approve current level
      security:
        - cookieAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalActionRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalInstance"
        "403":
          description: User's role does not match approver_role_id for current level

  /tenant/approvals/instances/{instanceId}/reject:
    parameters:
      - name: instanceId
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Tenant — Approvals]
      summary: Reject at current level
      security:
        - cookieAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalActionRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalInstance"

  /tenant/approvals/instances/{instanceId}/revision:
    parameters:
      - name: instanceId
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Tenant — Approvals]
      summary: Request revision — returns instance to initiator
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalActionRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalInstance"

  # ============================================================================
  # TENANT — AUDIT LOG
  # ============================================================================

  /tenant/audit:
    get:
      tags: [Tenant — Audit]
      summary: Query audit log with cursor pagination
      description: Uses cursor-based pagination (not LIMIT/OFFSET) — index on (tenant_id, timestamp DESC)
      security:
        - cookieAuth: []
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
          description: Opaque cursor from previous page response
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: userId
          in: query
          schema:
            type: string
        - name: action
          in: query
          schema:
            type: string
        - name: entityType
          in: query
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditLogPage"

  /tenant/audit/export:
    get:
      tags: [Tenant — Audit]
      summary: Export audit log as CSV or Excel
      security:
        - cookieAuth: []
      parameters:
        - name: format
          in: query
          schema:
            type: string
            enum: [csv, xlsx]
            default: csv
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: File download
          content:
            text/csv:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary

  # ============================================================================
  # TENANT — BROADCASTS (read receipts)
  # ============================================================================

  /tenant/broadcasts/unread:
    get:
      tags: [Tenant — Broadcasts]
      summary: Get unread broadcasts for tenant — called on every login
      security:
        - cookieAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Broadcast"

  /tenant/broadcasts/{broadcastId}/read:
    parameters:
      - name: broadcastId
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Tenant — Broadcasts]
      summary: Mark broadcast as read (dismiss banner)
      security:
        - cookieAuth: []
      responses:
        "204":
          description: Read receipt created

  # ============================================================================
  # PLATFORM — TENANTS
  # ============================================================================

  /platform/tenants:
    get:
      tags: [Platform — Tenants]
      summary: List all tenants with health metrics (precomputed snapshot JOIN — no N+1)
      security:
        - cookieAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [DRAFT, PROVISIONING, ACTIVE, SUSPENDED, TERMINATED]
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 25
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/TenantWithHealth"
                  nextCursor:
                    type: string
                    nullable: true
    post:
      tags: [Platform — Tenants]
      summary: Create a new tenant (status = DRAFT)
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantCreate"
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"

  /platform/tenants/{tenantId}:
    parameters:
      - name: tenantId
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Platform — Tenants]
      summary: Get tenant details with onboarding checklist
      security:
        - cookieAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantWithHealth"
    put:
      tags: [Platform — Tenants]
      summary: Update tenant details
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantCreate"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"

  /platform/tenants/{tenantId}/suspend:
    parameters:
      - name: tenantId
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Platform — Tenants]
      summary: Suspend tenant (ACTIVE → SUSPENDED)
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantLifecycleAction"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"

  /platform/tenants/{tenantId}/activate:
    parameters:
      - name: tenantId
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Platform — Tenants]
      summary: Activate tenant (PROVISIONING or SUSPENDED → ACTIVE)
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantLifecycleAction"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "400":
          description: Onboarding checklist not complete (mandatory items missing)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error: { code: ONBOARDING_INCOMPLETE, message: "Cannot activate: GSTIN and payment gateway required" }

  /platform/tenants/{tenantId}/terminate:
    parameters:
      - name: tenantId
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Platform — Tenants]
      summary: Terminate tenant — irreversible after 30-day data hold
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantLifecycleAction"
              description: confirmation must match tenant's legalName
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "400":
          description: Confirmation name does not match
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /platform/tenants/{tenantId}/resend-credentials:
    parameters:
      - name: tenantId
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Platform — Tenants]
      summary: Re-send activation email to tenant's registered address
      security:
        - cookieAuth: []
      responses:
        "204":
          description: Email sent

  /platform/tenants/{tenantId}/impersonate:
    parameters:
      - name: tenantId
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Platform — Tenants]
      summary: Start impersonation session — issues scoped 30-min non-renewable JWT
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Scoped impersonation token set as HTTP-only cookie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImpersonateResponse"
        "403":
          description: Cannot impersonate a TERMINATED tenant

  /platform/tenants/{tenantId}/metrics:
    parameters:
      - name: tenantId
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Platform — Tenants]
      summary: Get latest metric snapshot for a tenant
      security:
        - cookieAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  activeUsers30d:
                    type: integer
                  apiCalls30d:
                    type: integer
                  errorRate:
                    type: number
                  storageBytesUsed:
                    type: integer
                  lastLoginAt:
                    type: string
                    format: date-time
                    nullable: true
                  snapshotDate:
                    type: string
                    format: date-time

  /platform/tenants/{tenantId}/flags:
    parameters:
      - name: tenantId
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Platform — Tenants]
      summary: List feature flag overrides for tenant
      security:
        - cookieAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/FeatureFlag"

  /platform/tenants/{tenantId}/flags/{featureKey}:
    parameters:
      - name: tenantId
        in: path
        required: true
        schema:
          type: string
      - name: featureKey
        in: path
        required: true
        schema:
          type: string
    put:
      tags: [Platform — Tenants]
      summary: Set feature flag override for tenant
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeatureFlag"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeatureFlag"

  /platform/tenants/{tenantId}/subscription:
    parameters:
      - name: tenantId
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Platform — Tenants]
      summary: Assign or change subscription plan
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantPlanAssign"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "400":
          description: Downgrade would exceed tenant's current usage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
              example:
                error: { code: DOWNGRADE_EXCEEDS_USAGE, message: "Tenant has 12 users but new plan allows 10. Confirm to deactivate excess users." }

  # ============================================================================
  # PLATFORM — SUBSCRIPTIONS
  # ============================================================================

  /platform/subscriptions:
    get:
      tags: [Platform — Subscriptions]
      summary: List subscription plans
      security:
        - cookieAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/SubscriptionPlan"
    post:
      tags: [Platform — Subscriptions]
      summary: Create a subscription plan
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionPlan"
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionPlan"

  /platform/subscriptions/{planId}:
    parameters:
      - name: planId
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Platform — Subscriptions]
      summary: Get plan details
      security:
        - cookieAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionPlan"
    put:
      tags: [Platform — Subscriptions]
      summary: Update plan (entitlements updated immediately for tenants on this plan)
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionPlan"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionPlan"

  # ============================================================================
  # PLATFORM — USERS
  # ============================================================================

  /platform/users:
    get:
      tags: [Platform — Users]
      summary: List platform admin users
      security:
        - cookieAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/PlatformUser"
    post:
      tags: [Platform — Users]
      summary: Invite platform admin — sends activation email
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlatformUserCreate"
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformUser"

  /platform/users/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Platform — Users]
      summary: Get platform user
      security:
        - cookieAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformUser"
    put:
      tags: [Platform — Users]
      summary: Update platform user
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlatformUserCreate"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformUser"

  /platform/users/{userId}/status:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
    patch:
      tags: [Platform — Users]
      summary: Toggle platform user status — immediately invalidates Redis session
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [ACTIVE, INACTIVE]
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformUser"

  # ============================================================================
  # PLATFORM — SECURITY
  # ============================================================================

  /platform/security:
    get:
      tags: [Platform — Security]
      summary: Get platform-level security settings
      description: Separate from /tenant/settings/security — governs platform admin users only
      security:
        - cookieAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformSecuritySettings"
    put:
      tags: [Platform — Security]
      summary: Update platform security settings
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlatformSecuritySettings"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformSecuritySettings"

  # ============================================================================
  # PLATFORM — AUDIT LOG
  # ============================================================================

  /platform/audit:
    get:
      tags: [Platform — Audit]
      summary: Query platform audit log (cursor pagination)
      security:
        - cookieAuth: []
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 25
        - name: userId
          in: query
          schema:
            type: string
        - name: tenantId
          in: query
          schema:
            type: string
        - name: action
          in: query
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditLogPage"

  /platform/audit/export:
    get:
      tags: [Platform — Audit]
      summary: Export platform audit log
      security:
        - cookieAuth: []
      parameters:
        - name: format
          in: query
          schema:
            type: string
            enum: [csv, xlsx]
            default: csv
      responses:
        "200":
          description: File download
          content:
            text/csv:
              schema:
                type: string
                format: binary

  # ============================================================================
  # PLATFORM — BROADCASTS
  # ============================================================================

  /platform/broadcasts:
    get:
      tags: [Platform — Broadcasts]
      summary: List all sent broadcasts
      security:
        - cookieAuth: []
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Broadcast"
    post:
      tags: [Platform — Broadcasts]
      summary: Send announcement or maintenance notice to tenants
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BroadcastCreate"
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Broadcast"
        "400":
          description: targetTenantIds required when scope is SINGLE or SELECTION
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  # ============================================================================
  # PLATFORM — SEARCH
  # ============================================================================

  /platform/search:
    get:
      tags: [Platform — Search]
      summary: Global search across all tenants by name, GSTIN, email, or tenant ID
      security:
        - cookieAuth: []
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/SearchResult"
